<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Chess</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0503">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0503;--panel:#1b0d06;--gold:#ffd86b;--gold2:#c98a1f;--text:#fff3d6;--muted:#c9b48a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--text);font-family:Cinzel,Georgia,serif;overflow:hidden}
body{background:linear-gradient(rgba(5,2,2,.5),rgba(5,2,2,.82)),url(bg.jpg) center/cover no-repeat #050202}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;text-align:center}
.scr.on{display:flex}
.btn{font:900 18px Cinzel,Georgia,serif;padding:14px 34px;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(#e0a52a,#8a5410);color:#2a1500;cursor:pointer;min-width:220px}
.btn.alt{background:var(--panel);color:var(--gold)}
.btn.sm{min-width:0;padding:8px 16px;font-size:14px}
.chip{font:700 15px Cinzel,Georgia,serif;padding:10px 16px;border-radius:999px;border:2px solid #5a3a10;background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px #ff9a0066}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
h2{margin:0;font-size:clamp(22px,5vw,32px);color:var(--gold)}
p{margin:0;color:var(--muted);font-family:Georgia,serif;max-width:420px}
.demo{background:#2a1a08;border:1px dashed var(--gold2);border-radius:8px;padding:8px 12px;font:14px Georgia,serif;color:var(--gold)}
.emblem{width:min(78vw,52vh,460px);aspect-ratio:1;border-radius:24px;border:3px solid var(--gold);box-shadow:0 0 40px #ff9a0066;object-fit:cover}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--panel);color:var(--gold);font-size:20px;cursor:pointer}
.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lv{display:flex;flex-direction:column;gap:10px;align-items:center}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(94vw,54vh,620px);aspect-ratio:1;border:3px solid var(--gold);border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 0 30px #ff9a0055}
.sq{min-width:0;min-height:0;overflow:hidden;position:relative;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:8.6cqw;line-height:1;cursor:pointer;background:#d9b677}
.sq.d{background:#8a5a22}
.sq.lm{box-shadow:inset 0 0 0 100px rgba(255,216,107,.35)}.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,216,107,.6)}.sq.chk{box-shadow:inset 0 0 0 100px rgba(220,30,30,.6)}
.sq.cur{outline:4px solid #5ad1ff;outline-offset:-4px;z-index:1}
.sq.dot::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,10,0,.45)}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(220,30,30,.8)}
.pz{display:block;paint-order:stroke fill}
.pz.w{color:#fff;-webkit-text-stroke:3.5px #2a1400;filter:drop-shadow(0 2px 2px #0009)}
.pz.b{color:#0d0905;-webkit-text-stroke:2.5px #e0b050;filter:drop-shadow(0 2px 2px #0009)}
.pz.pop{animation:pop .35s ease-out}@keyframes pop{40%{transform:scale(1.35)}}
.sp{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#ffc83d;box-shadow:0 0 8px #ff9a00;animation:spk .7s ease-out forwards;pointer-events:none;z-index:3}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(5,2,2,.8);display:none;align-items:center;justify-content:center;z-index:6}.ov.on{display:flex}
.card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;max-width:90vw}
#stat{font-weight:600;color:var(--gold);min-height:1.4em}
#moves{width:min(94vw,620px);max-height:3.6em;overflow-y:auto;background:rgba(20,10,4,.7);border:1px solid #5a3a10;border-radius:8px;padding:4px 10px;font:13px Georgia,serif;color:var(--text);text-align:left;min-height:1.8em}
#hint{color:var(--muted);font:12px Georgia,serif;max-width:92vw}
@media (prefers-reduced-motion:reduce){.pz.pop,.sp{animation:none}}
</style>
</head>
<body>
<button id="snd" type="button" aria-label="Sound on or off">🔊</button>

<section class="scr on" id="s-welcome">
  <img class="emblem" alt="Royal Chess" src="logo.jpg">
  <button class="btn" id="enter" type="button">Enter the Kingdom</button>
  <div class="demo">Tap or press Enter to switch on the royal sound.</div>
</section>

<section class="scr" id="s-offline">
  <h2>Offline play</h2><p>No internet and no login needed.</p>
  <div class="modes" id="sides" role="group" aria-label="You play as">
    <button class="chip" data-side="w" aria-pressed="true" type="button">♔ White</button>
    <button class="chip" data-side="b" aria-pressed="false" type="button">♚ Black</button>
    <button class="chip" data-side="r" aria-pressed="false" type="button">🎲 Random</button>
  </div>
  <div class="lv">
    <button class="btn" data-lvl="0" type="button">Computer · Easy</button>
    <button class="btn" data-lvl="1" type="button">Computer · Medium</button>
    <button class="btn" data-lvl="2" type="button">Computer · Hard</button>
    <button class="btn alt" data-lvl="f" type="button">Play with a friend</button>
    <button class="btn alt sm" id="o-back" type="button">Back</button>
  </div>
</section>

<section class="scr" id="s-board" style="gap:8px">
  <div id="b-title" style="color:var(--muted);font:600 14px Georgia,serif"></div>
  <div id="board"></div>
  <div id="stat" role="status" aria-live="polite"></div>
  <div id="moves" aria-label="Moves played"></div>
  <div id="hint">Arrow keys or mouse move the blue box · Enter selects a piece, then Enter on a dot to move · Esc cancels</div>
  <div class="modes">
    <button class="btn alt sm" id="g-new" type="button">New game</button>
    <button class="btn alt sm" id="g-draw" type="button">Offer draw</button>
    <button class="btn alt sm" id="g-res" type="button">Resign</button>
    <button class="btn alt sm" id="g-menu" type="button">Menu</button>
  </div>
</section>
<div class="ov" id="ov"><div class="card"><h2 id="ov-t"></h2><div class="modes" id="ov-b"></div></div></div>

<script id="eng">
const D={N:[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],B:[[-1,-1],[-1,1],[1,-1],[1,1]],R:[[-1,0],[1,0],[0,-1],[0,1]]};
D.Q=D.B.concat(D.R);D.K=D.Q;
const START=()=>{const o='RNBQKBNR',b=Array(64).fill(null);for(let i=0;i<8;i++){b[i]='b'+o[i];b[8+i]='bP';b[48+i]='wP';b[56+i]='w'+o[i]}return b};
const newState=()=>({b:START(),turn:'w',cs:{wK:1,wQ:1,bK:1,bQ:1},ep:-1,half:0});
function attacked(b,sq,by){const r=sq>>3,c=sq&7,pr=by=='w'?r+1:r-1;
 for(const dc of[-1,1]){const cc=c+dc;if(pr>=0&&pr<8&&cc>=0&&cc<8&&b[pr*8+cc]==by+'P')return true}
 for(const[dr,dc]of D.N){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==by+'N')return true}
 for(const[dr,dc]of D.K){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==by+'K')return true}
 for(const d of D.Q){let rr=r+d[0],cc=c+d[1];while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=b[rr*8+cc];if(p){if(p[0]==by&&(p[1]=='Q'||p[1]==(d[0]&&d[1]?'B':'R')))return true;break}rr+=d[0];cc+=d[1]}}
 return false}
function pseudo(s,from){const b=s.b,p=b[from],col=p[0],t=p[1],r=from>>3,c=from&7,out=[];const add=(to,x)=>out.push({f:from,t:to,x});
 if(t=='P'){const dir=col=='w'?-1:1,sr=col=='w'?6:1,lr=col=='w'?0:7,r1=r+dir;
  if(r1>=0&&r1<8){if(!b[r1*8+c]){add(r1*8+c,r1==lr?'p':0);if(r==sr&&!b[(r+2*dir)*8+c])add((r+2*dir)*8+c,'d')}
   for(const dc of[-1,1]){const cc=c+dc;if(cc<0||cc>7)continue;const to=r1*8+cc,q=b[to];if(q&&q[0]!=col)add(to,r1==lr?'p':0);else if(to==s.ep)add(to,'e')}}
 }else if(t=='N'||t=='K'){for(const[dr,dc]of D[t]){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;const q=b[rr*8+cc];if(!q||q[0]!=col)add(rr*8+cc,0)}
  if(t=='K'){const home=col=='w'?60:4,opp=col=='w'?'b':'w';
   if(from==home&&!attacked(b,home,opp)){
    if(s.cs[col+'K']&&!b[home+1]&&!b[home+2]&&b[home+3]==col+'R'&&!attacked(b,home+1,opp)&&!attacked(b,home+2,opp))add(home+2,'k');
    if(s.cs[col+'Q']&&!b[home-1]&&!b[home-2]&&!b[home-3]&&b[home-4]==col+'R'&&!attacked(b,home-1,opp)&&!attacked(b,home-2,opp))add(home-2,'q')}}
 }else for(const d of D[t]){let rr=r+d[0],cc=c+d[1];while(rr>=0&&rr<8&&cc>=0&&cc<8){const q=b[rr*8+cc];if(!q)add(rr*8+cc,0);else{if(q[0]!=col)add(rr*8+cc,0);break}rr+=d[0];cc+=d[1]}}
 return out}
function make(s,m,pr){const b=s.b.slice(),p=b[m.f],col=p[0],cs={...s.cs};let ep=-1,cap=b[m.t];
 b[m.t]=p;b[m.f]=null;
 if(m.x=='e'){const cp=m.t+(col=='w'?8:-8);cap=b[cp];b[cp]=null}
 if(m.x=='d')ep=(m.f+m.t)/2;
 if(m.x=='k'){b[m.t-1]=b[m.t+1];b[m.t+1]=null}
 if(m.x=='q'){b[m.t+1]=b[m.t-2];b[m.t-2]=null}
 if(m.x=='p')b[m.t]=col+(pr||'Q');
 if(p[1]=='K'){cs[col+'K']=cs[col+'Q']=0}
 for(const[sq,k]of[[63,'wK'],[56,'wQ'],[7,'bK'],[0,'bQ']])if(m.f==sq||m.t==sq)cs[k]=0;
 return{b,turn:col=='w'?'b':'w',cs,ep,half:(p[1]=='P'||cap)?0:s.half+1}}
const kingSq=(b,c)=>b.indexOf(c+'K');
const inCheck=s=>attacked(s.b,kingSq(s.b,s.turn),s.turn=='w'?'b':'w');
function legal(s,from){const res=[],lo=from==null?0:from,hi=from==null?64:from+1;
 for(let f=lo;f<hi;f++){const p=s.b[f];if(!p||p[0]!=s.turn)continue;
  for(const m of pseudo(s,f)){const n=make(s,m,'Q');if(!attacked(n.b,kingSq(n.b,s.turn),n.turn))res.push(m)}}
 return res}
function result(s){const ms=legal(s),ch=inCheck(s);
 if(!ms.length)return ch?{t:'Checkmate! '+(s.turn=='w'?'Black':'White')+' wins.'}:{t:'Stalemate. The game is a draw.'};
 if(s.half>=100)return{t:'Draw by the 50-move rule.'};
 const ps=s.b.filter(p=>p&&p[1]!='K');
 if(!ps.length||(ps.length==1&&'NB'.includes(ps[0][1])))return{t:'Draw. Not enough material.'};
 return null}
const VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
function ev(s){let v=0,mat=0;const bp={w:0,b:0},kr={};
 for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const r=i>>3,c=i&7,t=p[1],w=p[0]=='w';let x=VAL[t];
  if(t!='P'&&t!='K')mat+=VAL[t];
  if('NBQ'.includes(t))x+=(4-Math.hypot(r-3.5,c-3.5))*6;
  if(t=='P'){const a=w?6-r:r-1;x+=a*8+(c>1&&c<6?a*2:0)}
  if(t=='B')bp[p[0]]++;if(t=='K')kr[p[0]]=[r,c];
  v+=w?x:-x}
 if(bp.w>1)v+=30;if(bp.b>1)v-=30;
 if(mat>2400)for(const k of['w','b']){const[r,c]=kr[k]||[0,0],hr=k=='w'?7:0,pen=Math.abs(r-hr)*14-((r==hr&&(c>=6||c<=2))?25:0);v+=k=='w'?-pen:pen}
 return v}
let DL=0,AB=false;
const mvv=(s,m)=>(s.b[m.t]?VAL[s.b[m.t][1]]*10-VAL[s.b[m.f][1]]/10:0)+(m.x=='p'?800:0);
function qs(s,al,be,d){const e=ev(s),sc=s.turn=='w'?e:-e;if(d<=0)return sc;if(sc>=be)return be;if(sc>al)al=sc;
 const ms=legal(s).filter(m=>s.b[m.t]||m.x=='e');ms.sort((x,y)=>mvv(s,y)-mvv(s,x));
 for(const m of ms){const v=-qs(make(s,m,'Q'),-be,-al,d-1);if(v>=be)return be;if(v>al)al=v}return al}
function nm(s,d,al,be){if(AB)return 0;if(Date.now()>DL){AB=true;return 0}
 if(d<=0)return qs(s,al,be,4);
 const ms=legal(s);if(!ms.length)return inCheck(s)?-99999-d:0;
 ms.sort((x,y)=>mvv(s,y)-mvv(s,x));
 for(const m of ms){const v=-nm(make(s,m,'Q'),d-1,-be,-al);if(AB)return 0;if(v>=be)return be;if(v>al)al=v}return al}
function aiMove(s,lvl){const ms=legal(s);if(ms.length<2)return ms[0];
 if(lvl<2){AB=false;DL=Date.now()+1e9;const d=lvl==0?1:2,nz=lvl==0?90:12;let best=ms[0],bv=-1e9;
  for(const m of ms){const v=-nm(make(s,m,'Q'),d-1,-1e9,1e9)+Math.random()*nz;if(v>bv){bv=v;best=m}}return best}
 AB=false;DL=Date.now()+2200;ms.sort((x,y)=>mvv(s,y)-mvv(s,x));let best=ms[0];
 for(let d=1;d<=9;d++){let al=-1e9,bm=null;
  for(const m of ms){const v=-nm(make(s,m,'Q'),d-1,-1e9,-al);if(AB)break;if(!bm||v>al){al=v;bm=m}}
  if(AB)break;best=bm;ms.splice(ms.indexOf(bm),1);ms.unshift(bm);if(al>90000)break}
 return best}
function san(s,m,pr){const p=s.b[m.f],t=p[1];let o;
 if(m.x=='k')o='O-O';else if(m.x=='q')o='O-O-O';else{
  const cap=s.b[m.t]||m.x=='e',to='abcdefgh'[m.t&7]+(8-(m.t>>3));
  if(t=='P')o=(cap?'abcdefgh'[m.f&7]+'x':'')+to+(m.x=='p'?'='+(pr||'Q'):'');
  else{o=t;const o2=legal(s).filter(x=>x.t==m.t&&x.f!=m.f&&s.b[x.f]==p);
   if(o2.length){const sf=o2.some(x=>(x.f&7)==(m.f&7)),sr=o2.some(x=>(x.f>>3)==(m.f>>3));
    if(!sf)o+='abcdefgh'[m.f&7];else if(!sr)o+=8-(m.f>>3);else o+='abcdefgh'[m.f&7]+(8-(m.f>>3))}
   o+=(cap?'x':'')+to}}
 const n=make(s,m,pr);if(inCheck(n))o+=legal(n).length?'+':'#';return o}
function posKey(s){return s.b.map(p=>p||'.').join('')+s.turn+s.cs.wK+s.cs.wQ+s.cs.bK+s.cs.bQ+(s.ep>=0&&legal(s).some(m=>m.x=='e')?s.ep:-1)}

</script>
<script>
const $=id=>document.getElementById(id);
const GL2={K:'\u265A\uFE0E',Q:'\u265B\uFE0E',R:'\u265C\uFE0E',B:'\u265D\uFE0E',N:'\u265E\uFE0E',P:'\u265F\uFE0E'};
let soundOn=true,ac=null,side='w',G=null,gid=0,worker=null,wBad=false,pend=null;
function show(id){$('ov').classList.remove('on');document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id=='s-welcome'||id=='s-offline'){const f=document.querySelector('#'+id+' .btn');if(f)setTimeout(()=>f.focus(),50)}}
function tone(notes,gap=.12,type='triangle',vol=.12){
  if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*gap;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.55)})}catch(e){}}
const click=()=>tone([660],0,'sine',.06),fanfare=()=>tone([392,523,659,784,1047],.16),ding=()=>tone([784,988],.1),bad=()=>tone([200],0,'square',.05);
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';click()};
document.addEventListener('click',e=>{if(e.target.closest('.btn,.chip'))click()});

// Welcome: sound switches on and the offline menu opens
$('enter').onclick=()=>{fanfare();show('s-offline')};

// AI runs in a Web Worker so the page never freezes. Falls back to the main thread if workers are blocked.
function mkWorker(){if(worker||wBad)return;try{
  const src=$('eng').textContent+';onmessage=e=>{postMessage(aiMove(e.data.s,e.data.lvl))}';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onerror=()=>{wBad=true;worker=null;if(pend){const f=pend;pend=null;f()}}}catch(e){wBad=true}}
function think(s,lvl,cb){mkWorker();
  if(worker&&!wBad){let done=false;const fin=m=>{if(done)return;done=true;pend=null;clearTimeout(to);cb(m)},to=setTimeout(()=>{wBad=true;if(worker)worker.terminate();worker=null;fin(aiMove(s,lvl))},10000);
    pend=()=>fin(aiMove(s,lvl));worker.onmessage=e=>fin(e.data);worker.postMessage({s,lvl})}
  else setTimeout(()=>cb(aiMove(s,lvl)),40)}

// Offline menu
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;document.querySelectorAll('[data-side]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>newGame(b.dataset.lvl=='f'?'pvp':'cpu',+b.dataset.lvl||0));
$('o-back').onclick=()=>show('s-welcome');

// Game
function newGame(mode,lvl){const you=mode=='cpu'?(side=='r'?(Math.random()<.5?'w':'b'):side):'w';
  G={s:newState(),mode,lvl,you,sel:-1,mv:[],last:null,over:false,busy:false,cur:you=='w'?52:12,id:++gid,hist:[],rep:{},res:null};
  G.rep[posKey(G.s)]=1;setOv();
  $('b-title').textContent=mode=='cpu'?'You ('+(you=='w'?'White':'Black')+') vs Computer · '+['Easy','Medium','Hard'][lvl]:'Friend vs Friend · White moves first';
  show('s-board');render();if(mode=='cpu'&&you=='b')aiTurn()}
function setOv(t,btns){const o=$('ov');if(!t){o.classList.remove('on');return}
  $('ov-t').textContent=t;const h=$('ov-b');h.innerHTML='';
  btns.forEach(([l,f])=>{const b=document.createElement('button');b.type='button';b.className='btn sm';b.textContent=l;b.onclick=()=>{click();f()};h.appendChild(b)});
  o.classList.add('on');if(h.firstChild)h.firstChild.focus()}
function render(){const B=$('board'),s=G.s,fl=G.you=='b';B.innerHTML='';const chk=inCheck(s)?kingSq(s.b,s.turn):-1;
  for(let k=0;k<64;k++){const i=fl?63-k:k,e=document.createElement('button'),r=i>>3,c=i&7,p=s.b[i];e.type='button';e.tabIndex=-1;e.dataset.i=i;
    e.className='sq '+((r+c)&1?'d':'l')+(i==G.sel?' sel':'')+(G.last&&(i==G.last.f||i==G.last.t)?' lm':'')+(i==chk?' chk':'')+(i==G.cur?' cur':'');
    const mv=G.mv.find(m=>m.t==i);if(mv)e.classList.add(p||mv.x=='e'?'cap':'dot');
    if(p)e.innerHTML='<span class="pz '+p[0]+'">'+GL2[p[1]]+'</span>';
    e.setAttribute('aria-label',(p?(p[0]=='w'?'White ':'Black ')+p[1]+' on ':'Empty ')+'abcdefgh'[c]+(8-r));
    e.onclick=()=>{G.cur=i;tap(i)};e.onmousemove=ev=>{if((ev.movementX||ev.movementY)&&G.cur!=i)setCur(i)};B.appendChild(e)}
  const res=G.res||result(s);
  let t=(s.turn=='w'?'White':'Black')+' to move'+(G.mode=='cpu'?(s.turn==G.you?' (your turn)':' (Computer)'):'')+(chk>=0?' · Check!':'');
  if(res){t=res.t;if(!G.over){G.over=true;fanfare();setTimeout(()=>setOv(res.t,[['Rematch',()=>newGame(G.mode,G.lvl)],['Menu',()=>{gid++;show('s-offline')}]]),700)}}
  $('stat').textContent=t;
  $('moves').textContent=G.hist.map((x,i)=>i%2?x:(i/2+1)+'. '+x).join(' ');$('moves').scrollTop=1e6}
function setCur(i){G.cur=i;document.querySelectorAll('#board .sq').forEach(x=>x.classList.toggle('cur',+x.dataset.i==i))}
function sqEl(i){return $('board').querySelector('[data-i="'+i+'"]')}
function burst(i){const e=sqEl(i);if(!e)return;for(let k=0;k<12;k++){const p=document.createElement('i');p.className='sp';const a=Math.random()*6.28,d=20+Math.random()*30;
  p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');e.appendChild(p);setTimeout(()=>p.remove(),750)}}
function tap(i){if(G.over||G.busy||(G.mode=='cpu'&&G.s.turn!=G.you))return;const s=G.s,m=G.mv.filter(x=>x.t==i);
  if(G.sel>=0&&m.length){if(m[0].x=='p')setOv('Promote to',['Q','R','B','N'].map(k=>[GL2[k]+' '+{Q:'Queen',R:'Rook',B:'Bishop',N:'Knight'}[k],()=>{setOv();play(m[0],k)}]));else play(m[0]);return}
  const p=s.b[i];if(i==G.sel){G.sel=-1;G.mv=[]}else if(p&&p[0]==s.turn){G.sel=i;G.mv=legal(s,i)}else{G.sel=-1;G.mv=[]}
  click();render()}
function aiTurn(){G.busy=true;$('stat').textContent='Computer is thinking…';const id=G.id;
  think(G.s,G.lvl,m=>{if(!G||G.id!=id||G.over)return;G.busy=false;play(m,'Q')})}
function play(m,pr){const s=G.s,cap=s.b[m.t]||m.x=='e';G.hist.push(san(s,m,pr));G.s=make(s,m,pr);
  const k=posKey(G.s);G.rep[k]=(G.rep[k]||0)+1;if(G.rep[k]>=3)G.res={t:'Draw by threefold repetition.'};
  G.last={f:m.f,t:m.t};G.sel=-1;G.mv=[];render();
  const pz=sqEl(m.t)&&sqEl(m.t).querySelector('.pz');if(pz)pz.classList.add('pop');
  if(cap){burst(m.t);tone([300,200],.07,'sawtooth',.08)}else tone([520],0,'triangle',.08);
  if(inCheck(G.s))setTimeout(()=>tone([880,880],.1,'square',.05),150);
  if(!G.over&&G.mode=='cpu'&&G.s.turn!=G.you)aiTurn()}
$('g-menu').onclick=()=>{gid++;setOv();show('s-offline')};$('g-new').onclick=()=>newGame(G.mode,G.lvl);
$('g-res').onclick=()=>{if(G.over||G.busy)return;
  setOv('Resign this game?',[['Yes, resign',()=>{setOv();const l=G.mode=='cpu'?G.you:G.s.turn;G.res={t:(l=='w'?'White':'Black')+' resigns. '+(l=='w'?'Black':'White')+' wins.'};render()}],['Keep playing',()=>setOv()]])};
$('g-draw').onclick=()=>{if(G.over||G.busy)return;
  if(G.mode=='cpu'){const e=ev(G.s),cs=G.you=='w'?-e:e;
    if(cs<=30){G.res={t:'Draw agreed. The computer accepted.'};render()}else{$('stat').textContent='The computer declines the draw.';bad()}}
  else{const o=G.s.turn=='w'?'Black':'White';setOv(o+', accept the draw?',[['Accept',()=>{setOv();G.res={t:'Draw agreed.'};render()}],['Decline',()=>setOv()]])}};

// Keyboard
function moveCur(dr,dc){const fl=G.you=='b',s=fl?63-G.cur:G.cur;
  const r=Math.max(0,Math.min(7,(s>>3)+dr)),c=Math.max(0,Math.min(7,(s&7)+dc)),n=r*8+c;setCur(fl?63-n:n);tone([440],0,'sine',.03)}
addEventListener('keydown',e=>{const on=id=>$(id).classList.contains('on'),k=e.key;
  if(on('s-welcome')&&k=='Enter'){e.preventDefault();$('enter').click();return}
  if(!G||!on('s-board')||on('ov'))return;
  if(k=='ArrowLeft'||k=='ArrowRight'||k=='ArrowUp'||k=='ArrowDown'){e.preventDefault();moveCur(k=='ArrowUp'?-1:k=='ArrowDown'?1:0,k=='ArrowLeft'?-1:k=='ArrowRight'?1:0)}
  else if(k=='Enter'){e.preventDefault();tap(G.cur)}
  else if(k=='Escape'){G.sel=-1;G.mv=[];render()}});
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
